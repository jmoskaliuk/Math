# Automated checks for both plugins in a real Moodle (moodle-plugin-ci).
# Each plugin is tested on its own; the other one is installed alongside.
name: Moodle Plugin CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            moodle-branch: 'MOODLE_401_STABLE'
            plugin: 'mod/mathetrainer'
            extra: 'local/curriculum_math'
          - php: '8.3'
            moodle-branch: 'MOODLE_405_STABLE'
            plugin: 'mod/mathetrainer'
            extra: 'local/curriculum_math'
          - php: '8.3'
            moodle-branch: 'MOODLE_405_STABLE'
            plugin: 'local/curriculum_math'
            extra: 'mod/mathetrainer'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Prepare plugin directories
        run: |
          mkdir -p plugin extra
          cp -r "repo/moodle-mathetrainer/${{ matrix.plugin }}/." plugin/
          cp -r "repo/moodle-mathetrainer/${{ matrix.extra }}" extra/

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, intl, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle with the plugins
        run: moodle-plugin-ci install --plugin ./plugin --extra-plugins ./extra --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle code checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0 --standard="$GITHUB_WORKSPACE/repo/moodle-mathetrainer/phpcs.xml"

      - name: Moodle PHPDoc checker
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci phpdoc

      - name: Validate plugin structure
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
